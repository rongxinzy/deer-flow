name: CI

# Single PR/push entry: fast path filters, lockfile-keyed caches, one required aggregate job (`ci-gate`).

on:
  push:
    branches: [main, "*-dev"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_VERSION: "0.11.1"
  PNPM_VERSION: "10.26.2"
  NODE_VERSION: "24"

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      blocking_io: ${{ steps.filter.outputs.blocking_io }}
      replay: ${{ steps.filter.outputs.replay }}
      e2e: ${{ steps.filter.outputs.e2e }}
      skills: ${{ steps.filter.outputs.skills }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'skills/public/**'
              - 'contracts/**'
              - 'scripts/**'
              - 'tests/skills/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            blocking_io:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            replay:
              - 'frontend/**'
              - 'backend/app/gateway/**'
              - 'backend/packages/harness/**'
              - 'backend/tests/fixtures/replay/**'
              - 'backend/tests/replay_provider.py'
              - 'backend/tests/_replay_fixture.py'
              - 'backend/tests/seed_runs_router.py'
              - 'backend/tests/test_replay_golden.py'
              - 'backend/scripts/run_replay_gateway.py'
              - '.github/workflows/ci.yml'
            e2e:
              - 'frontend/**'
              - 'backend/app/gateway/routers/plugins.py'
              - 'backend/extension_test_fixtures/**'
              - 'backend/packages/extension-api/**'
              - 'backend/packages/harness/deerflow/extensions/**'
              - 'backend/packages/harness/deerflow/config/plugin_settings.py'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - 'examples/deerflow-extension-bookmarks/**'
              - '.github/workflows/ci.yml'
            skills:
              - 'skills/public/**'
              - 'backend/packages/harness/deerflow/skills/review/**'
              - 'contracts/skill_review/**'
              - 'scripts/review_changed_public_skills.py'
              - 'scripts/skill_review_waivers.py'
              - '.github/skill-review-waivers.v1.json'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - '.github/workflows/ci.yml'

  large-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Check tracked file sizes
        run: python3 scripts/check_large_files.py

      - name: Check source file line counts
        run: python3 scripts/check_source_line_limits.py

  dead-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Vulture (Python)
        working-directory: backend
        run: |
          uv sync --group dev
          uv run vulture app packages --min-confidence 80

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm
        run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Knip (frontend)
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec knip --no-progress

  lint-backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Check uv.lock is in sync
        working-directory: backend
        run: uv lock --check

      - name: Install dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Lint backend
        working-directory: backend
        run: make lint

  lint-frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm
        run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        working-directory: frontend
        run: pnpm format

      - name: Run frontend linting
        working-directory: frontend
        run: pnpm lint

      - name: Typecheck frontend
        working-directory: frontend
        run: pnpm typecheck

  frontend-build:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm
        run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            nextjs-${{ runner.os }}-

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          BETTER_AUTH_SECRET: local-dev-secret
        run: pnpm build

  backend-unit-tests:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: deerflow
          POSTGRES_PASSWORD: deerflow
          POSTGRES_DB: deerflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_POSTGRES_URI: postgresql://deerflow:deerflow@localhost:5432/deerflow_test?sslmode=disable
      DEDUPE_TEST_POSTGRES_URL: postgresql://deerflow:deerflow@localhost:5432/deerflow_test?sslmode=disable

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev --extra postgres

      - name: Collect tests on documented default install (shard 1 only)
        if: matrix.shard == 1
        working-directory: backend
        run: |
          uv sync --group dev
          uv run pytest --collect-only -q

      - name: Run backend unit tests (shard ${{ matrix.shard }}/4)
        working-directory: backend
        run: make test-shard SPLITS=4 GROUP=${{ matrix.shard }}

  backend-blocking-io:
    needs: changes
    if: needs.changes.outputs.blocking_io == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Run blocking IO regression tests
        working-directory: backend
        run: make test-blocking-io

  frontend-unit-tests:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm
        run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Run frontend unit tests
        working-directory: frontend
        run: make test

  replay-e2e:
    needs: changes
    if: needs.changes.outputs.replay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        layer: [backend-golden, fullstack-render]

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        if: matrix.layer == 'backend-golden' || matrix.layer == 'fullstack-render'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Replay golden (backend SSE contract)
        if: matrix.layer == 'backend-golden'
        working-directory: backend
        run: PYTHONPATH=. uv run pytest tests/test_replay_golden.py -q

      - name: Setup Node.js
        if: matrix.layer == 'fullstack-render'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Enable Corepack
        if: matrix.layer == 'fullstack-render'
        run: corepack enable

      - name: Use pinned pnpm
        if: matrix.layer == 'fullstack-render'
        run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install frontend dependencies
        if: matrix.layer == 'fullstack-render'
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        if: matrix.layer == 'fullstack-render'
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Full-stack replay render
        if: matrix.layer == 'fullstack-render'
        working-directory: frontend
        run: pnpm exec playwright test -c playwright.real-backend.config.ts

  e2e-tests:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies (bookmark plugin gateway)
        working-directory: backend
        run: uv sync --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Use pinned pnpm
        run: corepack prepare pnpm@${{ env.PNPM_VERSION }} --activate

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        working-directory: frontend
        env:
          SKIP_ENV_VALIDATION: "1"
        run: pnpm exec playwright test

      - name: Run auth recovery E2E tests
        working-directory: frontend
        env:
          SKIP_ENV_VALIDATION: "1"
        run: pnpm exec playwright test -c playwright.auth.config.ts

  skill-review:
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.1"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      - name: Review changed public skills (pull request)
        if: github.event_name == 'pull_request'
        working-directory: backend
        run: |
          uv run python ../scripts/review_changed_public_skills.py \
            --base-ref "${{ github.event.pull_request.base.sha }}" \
            --head-ref "${{ github.event.pull_request.head.sha }}"

      - name: Review changed public skills (push)
        if: github.event_name == 'push'
        working-directory: backend
        run: |
          uv run python ../scripts/review_changed_public_skills.py \
            --before "${{ github.event.before }}" \
            --after "${{ github.event.after }}"

  ci-gate:
    name: ci-gate
    runs-on: ubuntu-latest
    needs:
      - changes
      - large-files
      - dead-code
      - lint-backend
      - lint-frontend
      - frontend-build
      - backend-unit-tests
      - backend-blocking-io
      - frontend-unit-tests
      - replay-e2e
      - e2e-tests
      - skill-review
    if: always()
    steps:
      - uses: actions/checkout@v6
      - name: Aggregate CI results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_aggregate_gate.py "$NEEDS_JSON"
