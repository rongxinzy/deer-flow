name: DevOps gate

# Retired from the PR path: branch protection requires the aggregate `CI / ci-gate` job.
# Kept for manual runs only so existing links do not 404.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "DevOps metadata gate was removed from the PR path."
          echo "Use the CI workflow aggregate job 'ci' instead."
