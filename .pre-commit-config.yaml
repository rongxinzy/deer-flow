# Only git hook: block newly added files over 5000 tokens (see AGENTS.md "File Size").
# Lint/format/lock checks run in CI.
repos:
  - repo: local
    hooks:
      - id: new-file-token-limit
        name: new files <= 5000 tokens
        entry: node scripts/check-new-file-tokens.mjs
        language: system
        pass_filenames: false
        always_run: true
